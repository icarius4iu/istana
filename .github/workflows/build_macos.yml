name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Sin firma/notarización (requiere un Developer ID de Apple como
      # secreto del repo) — esto valida que compila y corre localmente.
      - run: flutter build macos --release

      - uses: actions/upload-artifact@v4
        with:
          name: istana-macos
          path: build/macos/Build/Products/Release/mp3_player_flutter.app
