name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze + unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - run: flutter pub get

      # Regenera los adapters de Hive (song_hive.g.dart, etc.) — falla acá
      # si el código anotado y lo generado se desincronizaron.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: dart format --output=none --set-exit-if-changed lib test

      # Solo unit/widget tests: los de integration_test/ necesitan un
      # dispositivo/navegador real (ver build_linux.yml para ese caso).
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
